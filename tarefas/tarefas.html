<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="./tarefasStyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <a href="../listas/index.html"><button id="return">Return</button></a>
    <div class="container">
        <div class="content">
            <h1 id="list_title">To Do List</h1>
            <input type="text" name="task" id="task-title" placeholder="Add a new item">
            <button id="add-task">Add</button>
            <br>
            <p>Order by:</p>
            <div class="filter">
                <select id="filter-select">
                    <option value="Completed">Completed tasks</option>
                    <option value="Not">Not completed tasks</option>
                </select>
            </div>
            <br>
            <p>Search:</p>
            <input type="text" name="" id="search-task" placeholder="Search Tasks">
        </div>
        <div>  
        </div>
        <div class="task-field">
            <ol id="task-list">
                
            </ol>
        </div>
    </div>
</body>
<script type="module" src="./tarefasScript.js"></script>
</html>
